app = "everflow-automations-prod"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "10s"
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
  SQLITE_PATH = "/data/everflow.db"
  DELETION_LEDGER_PATH = "/data/deletion-ledger.db"
  DATABASE_DRIVER = "sqlite"
  INTERNAL_CRON = "on"
  BACKUP_ENABLED = "on"
  BACKUP_DIR = "/data/backups"
  BACKUP_INTERVAL_HOURS = "24"
  BACKUP_LOCAL_RETENTION_DAYS = "7"
  BACKUP_REMOTE_RETENTION_DAYS = "30"
  BACKUP_REQUIRE_REMOTE = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1


[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "everflow_data"
  destination = "/data"
